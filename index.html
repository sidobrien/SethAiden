<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Seth Aiden House Models</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three model tabs over one 3D stage, with a control dock that changes per tab. */
:root{
  --bg:#EDF0F2;
  --panel:#FFFFFF;
  --fg:#14202A;
  --muted:#52606B;
  --line:#CFD7DD;
  --chip:#E1E8ED;
  --accent:#0A6783;
  --accent-fg:#FFFFFF;
  --font-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B;--panel:#17212A;--fg:#E6EEF2;--muted:#9BA9B4;--line:#2A3742;--chip:#202C36;--accent:#5CC3E0;--accent-fg:#06222B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B;--panel:#17212A;--fg:#E6EEF2;--muted:#9BA9B4;--line:#2A3742;--chip:#202C36;--accent:#5CC3E0;--accent-fg:#06222B;color-scheme:dark;
}
html{height:100%}body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-block:14px}
header{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
h1{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-0.01em;text-wrap:balance}
.facts{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.tab{
  border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:10px 16px;min-height:44px;
  font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#stage{position:relative;flex:1 1 auto;min-height:min(62vh,560px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#dfe6ec}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.rl.dim{background:#14202A;color:#fff;border-color:#14202A}
@media (max-width:600px){h1{font-size:22px}.tab{padding:10px 12px}#stage{min-height:58vh}}
.fail{margin:24px;color:#14202A;font-size:15px}
.dock{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:flex-start}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.group h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 12px;min-height:40px;border-radius:8px;
  font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip:focus-visible,#sep:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sliderRow{display:flex;align-items:center;gap:10px;min-height:40px}
#sep{width:170px;max-width:100%;accent-color:var(--accent)}
.val{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:4.2em}
.hint{margin:0;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Seth Aiden house</h1>
    <p class="facts" id="facts"></p>
  </header>

  <div class="tabs" role="tablist" aria-label="Models" id="tabs"></div>

  <div id="stage"><div id="labels"></div></div>

  <div class="dock">
    <div class="group" id="gFull"><h2>Show</h2><div class="seg" id="segFm"></div></div>
    <div class="group" id="gSep"><h2>Floor separation</h2>
      <div class="sliderRow"><input type="range" id="sep" min="0" max="8" step="0.1" value="3" aria-label="Floor separation in metres"><span class="val" id="sepVal">3.0 m</span></div>
    </div>
    <div class="group" id="gWalls"><h2>Walls</h2><div class="seg" id="segWall"></div></div>
    <div class="group"><h2>View</h2><div class="seg" id="segView"></div></div>
    <div class="group"><h2>Options</h2><div class="seg" id="segOpt"></div></div>
  </div>
  <p class="hint" id="hint">Drag to rotate, scroll or pinch to zoom, right-drag to pan. The model turns slowly until you switch Auto-rotate off.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage'), labelsEl = document.getElementById('labels');
  function fail(msg) { var p = document.createElement('p'); p.className = 'fail'; p.textContent = msg; stage.appendChild(p); }
  if (!window.THREE || !THREE.OrbitControls) { fail('The 3D library did not load. Check your connection and reload the page.'); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { fail('This browser could not start 3D graphics.'); return; }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  stage.insertBefore(renderer.domElement, labelsEl);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.05, 250);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.5; controls.maxDistance = 60; controls.maxPolarAngle = Math.PI / 2 - 0.01;
  controls.autoRotateSpeed = 1.6;

  /* ---------- textures ---------- */
  function mkCanvas(w, h, fn) { var c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
  function texFrom(c, rx, ry) {
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t;
  }
  function woodCanvas(base) {
    return mkCanvas(256, 256, function (g, w, h) {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      var n = 6, ph = h / n;
      for (var i = 0; i < n; i++) {
        var y = i * ph, a = Math.random() * 0.16 - 0.08;
        g.fillStyle = a > 0 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + (-a) + ')'; g.fillRect(0, y, w, ph);
        for (var k = 0; k < 26; k++) { g.fillStyle = 'rgba(60,30,10,' + (Math.random() * 0.12) + ')'; g.fillRect(0, y + Math.random() * ph, w, 1); }
        g.fillStyle = 'rgba(40,20,5,0.5)'; g.fillRect(0, y, w, 1.5);
        g.fillRect(Math.random() * w, y, 1.5, ph);
      }
    });
  }
  function tileCanvas(base) {
    return mkCanvas(256, 256, function (g, w, h) {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++) {
        var a = Math.random() * 0.1 - 0.05;
        g.fillStyle = a > 0 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + (-a) + ')'; g.fillRect(i * 128, j * 128, 128, 128);
      }
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h); g.fillRect(0, 127, w, 3); g.fillRect(127, 0, 3, h);
    });
  }
  function noiseCanvas(base, amt) {
    return mkCanvas(128, 128, function (g, w, h) {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      var id = g.getImageData(0, 0, w, h), d = id.data;
      for (var i = 0; i < d.length; i += 4) { var n = (Math.random() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      g.putImageData(id, 0, 0);
    });
  }
  var woodC1 = woodCanvas('#c9c6c1'), woodC2 = woodCanvas('#bdbab5'), woodDarkC = woodCanvas('#3a3b3e'), woodMidC = woodCanvas('#7d6a58'), woodSlatC = woodCanvas('#a07850');
  var blueTileC = tileCanvas('#9aa6ad'), greyTileC = tileCanvas('#b4b8bb'), hedgeC = noiseCanvas('#3f7a45', 60), rugC = noiseCanvas('#5f6368', 26), grassC = noiseCanvas('#7da067', 40);

  function std(o) { return new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.8, metalness: 0 }, o)); }
  var M = {
    wall: std({ color: '#868c93', roughness: 0.95 }),
    cap: std({ color: '#1d1f22', roughness: 0.6 }),
    wood1: std({ map: texFrom(woodC1, 1, 1), roughness: 0.55 }),
    wood2: std({ map: texFrom(woodC2, 1, 1), roughness: 0.55 }),
    woodDark: std({ map: texFrom(woodDarkC, 1, 1), roughness: 0.6 }),
    woodMid: std({ map: texFrom(woodMidC, 1, 1), roughness: 0.6 }),
    woodSlat: std({ map: texFrom(woodSlatC, 1, 1), roughness: 0.6 }),
    plate: std({ color: '#e6e8ea', roughness: 0.9 }),
    paving: std({ map: texFrom(greyTileC, 8, 1), roughness: 0.9 }),
    slabDark: std({ color: '#3b3e43', roughness: 0.7 }),
    hedge: std({ map: texFrom(hedgeC, 6, 1), roughness: 1 }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0xa8d4e4, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.1, clearcoat: 1, depthWrite: false }),
    frame: std({ color: '#25282d', roughness: 0.5, metalness: 0.3 }),
    steel: std({ color: '#b3b8bd', roughness: 0.35, metalness: 0.8 }),
    black: std({ color: '#17181a', roughness: 0.35, metalness: 0.2 }),
    cab: std({ color: '#4d5156', roughness: 0.55 }),
    cabCore: std({ color: '#2d2e31', roughness: 0.8 }),
    counter: std({ color: '#f0f1f2', roughness: 0.3 }),
    white: std({ color: '#eeeff0', roughness: 0.35 }),
    fabric: std({ color: '#c3c6ca', roughness: 1 }),
    fabricDark: std({ color: '#7d8187', roughness: 1 }),
    chair: std({ color: '#2c2d30', roughness: 0.8 }),
    linen: std({ color: '#c9cbce', roughness: 1 }),
    throwM: std({ color: '#5f6266', roughness: 1 }),
    pillow: std({ color: '#e3e4e6', roughness: 1 }),
    door: std({ color: '#4d5156', roughness: 0.6 }),
    doorEntry: std({ color: '#6b4a32', roughness: 0.5 }),
    tv: std({ color: '#0a0b0d', roughness: 0.2, metalness: 0.4 }),
    pot: std({ color: '#55575a', roughness: 0.8 }),
    trunk: std({ color: '#6b4a32', roughness: 0.95 }),
    lamp: new THREE.MeshStandardMaterial({ color: '#fff1d6', emissive: '#ffd49a', emissiveIntensity: 1.3 }),
    mat: std({ color: '#2f3033', roughness: 1 }),
    dim: new THREE.MeshBasicMaterial({ color: 0x14202a }),
    road: std({ color: '#3c3e42', roughness: 0.95 }),
    walk: std({ color: '#b9bbbe', roughness: 0.95 }),
    grass: std({ map: texFrom(grassC, 30, 30), roughness: 1 }),
    leaf: ['#3f7f4a', '#4c8f55', '#336b3f', '#5a9a5c'].map(function (c) { return std({ color: c, roughness: 0.9 }); })
  };
  var wallMats = [M.wall, M.wall, M.cap, M.wall, M.wall, M.wall];

  /* ---------- constants and registries ---------- */
  var FLOOR_H = 3.0, HC = 1.15, HF = 2.8;
  var STEP_RISE = 0.25, STEP_RUN = 0.236, STAIR_Z0 = -1.0, STAIR_Z1 = 1.6, STAIR_X = 0.6, STAIR_W = 1.5;
  var WALLS = [], TALL = [], FRONT = [], ROOF = [], DIMS = [], PLATE1 = [], LABELS = [];
  var UNIT = new THREE.BoxGeometry(1, 1, 1);
  var curFront = false;

  /* ---------- builders ---------- */
  function B(g, w, h, d, x, y0, z, mat, ns) {
    var m = new THREE.Mesh(UNIT, mat); m.scale.set(w, h, d); m.position.set(x, y0 + h / 2, z);
    if (ns) m.userData.ns = true; g.add(m); return m;
  }
  function Cy(g, rt, rb, h, x, y0, z, mat, seg) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), mat); m.position.set(x, y0 + h / 2, z); g.add(m); return m;
  }
  function sub(g, x, z, ry) { var s = new THREE.Group(); s.position.set(x, 0, z); s.rotation.y = ry || 0; g.add(s); return s; }
  function tall(o) { o.userData.tall = true; TALL.push(o); return o; }
  function front(o) { if (curFront) FRONT.push(o); return o; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function bar(g, ax, ay, az, bx, by, bz, t, mat) {
    var a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
    var m = new THREE.Mesh(UNIT, mat || M.frame);
    m.scale.set(t, t, a.distanceTo(b)); m.position.copy(a.clone().add(b).multiplyScalar(0.5));
    m.rotation.x = -Math.atan2(by - ay, bz - az); g.add(m); return m;
  }

  function slab(g, x0, z0, x1, z1, hole, mat, th) {
    var sh = new THREE.Shape();
    sh.moveTo(x0, z0); sh.lineTo(x1, z0); sh.lineTo(x1, z1); sh.lineTo(x0, z1); sh.lineTo(x0, z0);
    if (hole) {
      var p = new THREE.Path();
      p.moveTo(hole[0], hole[1]); p.lineTo(hole[0], hole[3]); p.lineTo(hole[2], hole[3]); p.lineTo(hole[2], hole[1]); p.lineTo(hole[0], hole[1]);
      sh.holes.push(p);
    }
    var geo = new THREE.ExtrudeGeometry(sh, { depth: th, bevelEnabled: false });
    geo.rotateX(Math.PI / 2);
    var m = new THREE.Mesh(geo, mat); g.add(m); return m;
  }
  function tileOverlay(g, x0, z0, x1, z1, canvas) {
    var w = x1 - x0, d = z1 - z0;
    var mat = std({ map: texFrom(canvas, w / 0.6, d / 0.6), roughness: 0.25 });
    return B(g, w, 0.012, d, (x0 + x1) / 2, 0.001, (z0 + z1) / 2, mat, true);
  }

  /* walls with doors and windows */
  var D = function (a, b, sw) { return { k: 'd', a: a, b: b, sw: sw }; };
  var Wn = function (a, b, s, h) { return { k: 'w', a: a, b: b, s: s, h: h }; };
  var GD = function (a, b) { return { k: 'g', a: a, b: b }; };

  function blk(g, axis, fixed, a, b, t, y0, y1, mat) {
    var len = b - a, c = (a + b) / 2, m = new THREE.Mesh(UNIT, mat || M.wall);
    if (axis === 'x') { m.scale.set(len, y1 - y0, t); m.position.set(c, (y0 + y1) / 2, fixed); }
    else { m.scale.set(t, y1 - y0, len); m.position.set(fixed, (y0 + y1) / 2, c); }
    g.add(m); front(m); return m;
  }
  function mkWall(g, axis, fixed, a, b, t) {
    var len = b - a, c = (a + b) / 2, m = new THREE.Mesh(UNIT, wallMats);
    if (axis === 'x') { m.scale.set(len, 1, t); m.position.set(c, 0, fixed); }
    else { m.scale.set(t, 1, len); m.position.set(fixed, 0, c); }
    WALLS.push(m); g.add(m); front(m);
  }
  function glassPane(g, axis, fixed, a, b, y0, y1) {
    var len = b - a, c = (a + b) / 2;
    var m = new THREE.Mesh(new THREE.PlaneGeometry(len, y1 - y0), M.glass);
    m.userData.ns = true;
    if (axis === 'x') m.position.set(c, (y0 + y1) / 2, fixed); else { m.position.set(fixed, (y0 + y1) / 2, c); m.rotation.y = Math.PI / 2; }
    g.add(m); tall(m); front(m);
  }
  function frameBar(g, axis, fixed, a, b, y0, y1, t) { tall(blk(g, axis, fixed, a, b, t + 0.02, y0, y1, M.frame)); }
  function doorLeaf(g, axis, fixed, a, b, sw, mat) {
    var w = b - a - 0.04, pv = new THREE.Group();
    var leaf = new THREE.Mesh(UNIT, mat || M.door);
    if (axis === 'x') { leaf.scale.set(w, 2.05, 0.04); leaf.position.set(w / 2, 1.025, 0); pv.position.set(a, 0, fixed); pv.rotation.y = -sw * 1.2; }
    else { leaf.scale.set(0.04, 2.05, w); leaf.position.set(0, 1.025, w / 2); pv.position.set(fixed, 0, a); pv.rotation.y = sw * 1.2; }
    pv.add(leaf); g.add(pv); tall(pv); front(pv);
  }
  function wall(g, axis, fixed, a0, a1, t, gaps) {
    curFront = (axis === 'x' && fixed === 2.5);
    gaps = (gaps || []).slice().sort(function (p, q) { return p.a - q.a; });
    var cur = a0;
    gaps.forEach(function (gp) { if (gp.a > cur) mkWall(g, axis, fixed, cur, gp.a, t); cur = gp.b; });
    if (a1 > cur) mkWall(g, axis, fixed, cur, a1, t);
    gaps.forEach(function (gp) {
      if (gp.k === 'w') {
        blk(g, axis, fixed, gp.a, gp.b, t, 0, gp.s);
        tall(blk(g, axis, fixed, gp.a, gp.b, t, gp.s + gp.h, HF));
        glassPane(g, axis, fixed, gp.a, gp.b, gp.s, gp.s + gp.h);
        frameBar(g, axis, fixed, gp.a, gp.b, gp.s, gp.s + 0.05, t);
        frameBar(g, axis, fixed, gp.a, gp.b, gp.s + gp.h - 0.05, gp.s + gp.h, t);
        frameBar(g, axis, fixed, gp.a, gp.a + 0.05, gp.s, gp.s + gp.h, t);
        frameBar(g, axis, fixed, gp.b - 0.05, gp.b, gp.s, gp.s + gp.h, t);
        if (gp.b - gp.a > 1.3) { var mid = (gp.a + gp.b) / 2; frameBar(g, axis, fixed, mid - 0.025, mid + 0.025, gp.s, gp.s + gp.h, t); }
      } else if (gp.k === 'd') {
        tall(blk(g, axis, fixed, gp.a, gp.b, t, 2.1, HF));
        doorLeaf(g, axis, fixed, gp.a, gp.b, gp.sw, (axis === 'x' && fixed === 2.5) ? M.doorEntry : M.door);
      } else {
        tall(blk(g, axis, fixed, gp.a, gp.b, t, 2.3, HF));
        glassPane(g, axis, fixed, gp.a, gp.b, 0, 2.3);
        var mid2 = (gp.a + gp.b) / 2;
        frameBar(g, axis, fixed, gp.a, gp.a + 0.05, 0, 2.3, t);
        frameBar(g, axis, fixed, gp.b - 0.05, gp.b, 0, 2.3, t);
        frameBar(g, axis, fixed, mid2 - 0.025, mid2 + 0.025, 0, 2.3, t);
        frameBar(g, axis, fixed, gp.a, gp.b, 2.25, 2.3, t);
      }
    });
    curFront = false;
  }

  /* furniture */
  function chair(g, x, z, ry) {
    var s = sub(g, x, z, ry);
    B(s, 0.42, 0.05, 0.42, 0, 0.43, 0, M.chair);
    B(s, 0.42, 0.42, 0.04, 0, 0.48, -0.2, M.chair);
    [[-0.18, -0.18], [0.18, -0.18], [-0.18, 0.18], [0.18, 0.18]].forEach(function (p) { B(s, 0.03, 0.43, 0.03, p[0], 0, p[1], M.woodMid); });
  }
  function sofa(g, len, x, z, ry) {
    var s = sub(g, x, z, ry), n = Math.max(1, Math.round(len / 0.7));
    B(s, len, 0.28, 0.9, 0, 0.08, 0, M.fabricDark);
    B(s, len, 0.5, 0.2, 0, 0.36, -0.35, M.fabric);
    for (var i = 0; i < n; i++) {
      var cw = (len - 0.4) / n;
      B(s, cw - 0.03, 0.14, 0.64, -len / 2 + 0.2 + cw * (i + 0.5), 0.36, 0.08, M.fabric);
    }

  })();

  /* shadow catcher for the floor-plan tabs */
  var catcher = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ opacity: 0.16 }));
  catcher.rotation.x = -Math.PI / 2; catcher.position.y = -0.3; catcher.receiveShadow = true; scene.add(catcher);

  /* ---------- light and sky ---------- */
  var sky = (function () {
    var c = document.createElement('canvas'); c.width = 4; c.height = 256;
    var g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#9fc3dc'); gr.addColorStop(1, '#eef3f6'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    return new THREE.CanvasTexture(c);
  })();
  scene.background = sky;
  var hemi = new THREE.HemisphereLight(0xffffff, 0xd3ccc0, 1.0); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff2de, 1.5);
  sun.position.set(9, 18, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
  sun.shadow.camera.left = -17; sun.shadow.camera.right = 17; sun.shadow.camera.top = 17; sun.shadow.camera.bottom = -17;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
  scene.add(sun);

  /* ---------- state ---------- */
  var TABS = [
    { id: 'full', label: 'Full house', facts: '10.00 x 5.00 m LOT  |  100 SQM FLOOR AREA  |  2 STOREYS  |  2 BEDROOMS  |  2 BATHS' },
    { id: 'ground', label: 'Ground floor plan', facts: 'GROUND FLOOR 50 SQM  |  KITCHEN + DINING 70%  |  LIVING 30% (3.0 x 5.0 m)  |  BATH 1.0 x 1.5 m' },
    { id: 'second', label: 'Second floor plan', facts: 'SECOND FLOOR 50 SQM  |  MASTER 3.7 x 5.0 m  |  BEDROOM 2 3.3 x 5.0 m  |  BATH 3.0 x 1.5 m' }
  ];
  var state = { tab: 'full', fm: 'open', walls: 'cut', sep: 3, view: 'iso', labels: false, rotate: true };
  var tw = null;

  function fullTab() { return state.tab === 'full'; }
  function wallsMode() { return fullTab() ? ((state.fm === 'doll' || state.fm === 'apart') ? 'cut' : 'full') : state.walls; }
  function upperTarget() { return fullTab() ? FLOOR_H + (state.fm === 'apart' ? state.sep : 0) : 0; }

  function apply() {
    var full = wallsMode() === 'full', ft = fullTab();
    var open = ft && state.fm === 'open', roof = ft && (state.fm === 'ext' || state.fm === 'open');
    g0.visible = state.tab !== 'second'; g1.visible = state.tab !== 'ground';
    var h = full ? HF : HC;
    WALLS.forEach(function (m) { m.scale.y = h; m.position.y = h / 2; });
    TALL.forEach(function (o) { o.visible = full; });
    FRONT.forEach(function (o) { o.visible = open ? false : (o.userData.tall ? full : true); });
    ROOF.forEach(function (o) { o.visible = roof; });
    DIMS.forEach(function (o) { o.visible = !ft; });
    PLATE1.forEach(function (o) { o.visible = !ft || state.fm === 'apart'; });
    stairDown.visible = !g0.visible;
    site.visible = ft; catcher.visible = !ft;
    document.getElementById('gFull').hidden = !ft;
    document.getElementById('gSep').hidden = !(ft && state.fm === 'apart');
    document.getElementById('gWalls').hidden = ft;
    document.getElementById('facts').textContent = TABS.filter(function (t) { return t.id === state.tab; })[0].facts;
    refreshUI();
  }
  function pose(name) {
    var ft = fullTab(), uy = upperTarget();
    var cy = ft ? (uy + 1.5 - 0.3) / 2 : 0.8, dist = ft ? 16 + uy * 0.9 : 15.5;
    var t, p;
    if (name === 'top') { t = new THREE.Vector3(0, cy, 0); p = new THREE.Vector3(0.01, cy + dist * 1.05, 0.9); }
    else if (name === 'front') { t = new THREE.Vector3(0, cy, 0); p = new THREE.Vector3(0, cy + 1.5, dist * 0.95); }
    else if (name === 'walk') {
      var fy = (!ft && state.tab === 'second') ? 0 : 0;
      t = new THREE.Vector3(-3.2, fy + 1.0, -0.6); p = new THREE.Vector3(4.5, fy + 1.55, 1.9);
    }
    else { t = new THREE.Vector3(0, cy, 0.3); p = t.clone().add(new THREE.Vector3(1, 0.8, 1.05).normalize().multiplyScalar(dist)); }
    return { p: p, t: t };
  }
  function goView(name, instant) {
    var v = pose(name);
    if (instant || reduce) { camera.position.copy(v.p); controls.target.copy(v.t); tw = null; return; }
    tw = { s: performance.now(), d: 1000, p0: camera.position.clone(), t0: controls.target.clone(), p1: v.p, t1: v.t };
  }


  /* ---------- UI ---------- */
  var refs = [];
  function refreshUI() { refs.forEach(function (f) { f(); }); }
  function seg(id, items, key, onPick) {
    var el = document.getElementById(id), btns = [];
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = it[1];
      b.addEventListener('click', function () { state[key] = it[0]; onPick(it[0]); refreshUI(); });
      el.appendChild(b); btns.push([b, it[0]]);
    });
    refs.push(function () { btns.forEach(function (x) { x[0].setAttribute('aria-pressed', String(state[key] === x[1])); }); });
  }
  function toggle(text, key, onChange) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = text;
    b.addEventListener('click', function () { state[key] = !state[key]; onChange(); refreshUI(); });
    document.getElementById('segOpt').appendChild(b);
    refs.push(function () { b.setAttribute('aria-pressed', String(state[key])); });
  }
  var tabBtns = [];
  TABS.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.id = 'tab-' + t.id; b.textContent = t.label;
    b.addEventListener('click', function () {
      state.tab = t.id; state.labels = t.id !== 'full'; state.rotate = true; controls.autoRotate = !reduce;
      if (t.id === 'full') state.fm = 'open';
      apply(); goView(state.view === 'walk' ? 'iso' : state.view); if (state.view === 'walk') state.view = 'iso'; refreshUI();
    });
    document.getElementById('tabs').appendChild(b); tabBtns.push([b, t.id]);
  });
  refs.push(function () { tabBtns.forEach(function (x) { x[0].setAttribute('aria-selected', String(state.tab === x[1])); }); });

  seg('segFm', [['open', 'Open front'], ['ext', 'Exterior'], ['roof', 'Roof off'], ['doll', 'Dollhouse'], ['apart', 'Floors apart']], 'fm', function () { apply(); goView(state.view); });
  seg('segWall', [['cut', 'Cutaway'], ['full', 'Full height']], 'walls', function () { apply(); });
  seg('segView', [['iso', 'Isometric'], ['top', 'Top plan'], ['front', 'Front'], ['walk', 'Inside']], 'view', function (v) { goView(v); });
  toggle('Room labels', 'labels', function () {});
  toggle('Auto-rotate', 'rotate', function () { controls.autoRotate = state.rotate && !reduce; });
  var sepEl = document.getElementById('sep'), sepVal = document.getElementById('sepVal');
  sepEl.addEventListener('input', function () {
    state.sep = parseFloat(sepEl.value); sepVal.textContent = state.sep.toFixed(1) + ' m';
    if (state.view !== 'walk') goView(state.view);
  });

  /* ---------- run ---------- */
  var v3 = new THREE.Vector3();
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
  controls.autoRotate = !reduce;
  apply(); goView('iso', true); resize();
  g1.position.y = upperTarget();

  function loop(now) {
    if (tw) {
      var u = Math.min(1, (now - tw.s) / tw.d), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      camera.position.lerpVectors(tw.p0, tw.p1, e); controls.target.lerpVectors(tw.t0, tw.t1, e);
      if (u >= 1) tw = null;
    }
    var ty = upperTarget();
    g1.position.y += (ty - g1.position.y) * (reduce ? 1 : 0.14);
    if (Math.abs(ty - g1.position.y) < 0.002) g1.position.y = ty;
    controls.update();
    renderer.render(scene, camera);

    var w = stage.clientWidth, h = stage.clientHeight, ft = fullTab();
    LABELS.forEach(function (L) {
      var show = L.g.visible && (L.kind === 'dim' ? !ft : state.labels);
      if (show) {
        v3.set(L.x, L.g.position.y + (L.kind === 'dim' ? -0.1 : 1.3), L.z).project(camera);
        if (v3.z > 1 || v3.z < -1) show = false;
        else { L.el.style.left = ((v3.x * 0.5 + 0.5) * w).toFixed(1) + 'px'; L.el.style.top = ((-v3.y * 0.5 + 0.5) * h).toFixed(1) + 'px'; }
      }
      L.el.style.display = show ? '' : 'none';
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
